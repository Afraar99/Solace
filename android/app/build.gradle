plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {

    namespace "com.mindful.android"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion '28.2.13676358'

    compileOptions {
        // Required by flutter_local_notifications
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        applicationId "com.mindful.android"
        minSdkVersion defaultMinSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }


    signingConfigs {
        release {
            // Prefer env vars (CI); fall back to android/key.properties (local).
            def storePath = System.getenv("KEYSTORE_FILE") ?: keystoreProperties['storeFile']
            if (storePath != null) {
                // Resolve relative paths from the android/ project root
                storeFile rootProject.file(storePath)
                storePassword System.getenv("STORE_PASSWORD") ?: keystoreProperties['storePassword']
                keyAlias System.getenv("KEY_ALIAS") ?: keystoreProperties['keyAlias']
                keyPassword System.getenv("KEY_PASSWORD") ?: keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            ndk {
                debugSymbolLevel 'full'
            }
            resValue "string", "app_name", "Solace"
            // Fall back to debug signing only if no release keystore is configured
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }

        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_name", "Solace Debug"
            signingConfig signingConfigs.debug
        }

        profile {
            // app_links library is causing error so commenting it out
            // applicationIdSuffix ".profile"
            resValue "string", "app_name", "Solace Profile"
            signingConfig signingConfigs.debug
        }
    }
    buildFeatures {
        viewBinding true
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
}

